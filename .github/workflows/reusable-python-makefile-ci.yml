name: Reusable Python CI via Make

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions"
        required: false
        type: string
        default: '["3.10","3.11","3.12","3.13","3.14"]'

      install-target:
        description: "Make target for installing development dependencies (makefile-skills)"
        required: false
        type: string
        default: "python-install-dev"

      ci-target:
        description: "Make target that runs lint, type checks, and tests (makefile-skills)"
        required: false
        type: string
        default: "python-check"

permissions:
  contents: read

jobs:
  python-makefile-ci:
    name: Python CI via Make
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python Version
        run: |
          python --version
          which python

      # .makefiles/ is gitignored; clone makefile-skills before python-* targets exist.
      # make init errors if the directory already exists, so mirror ensure-skills.
      - name: Ensure Makefile Skills
        run: |
          set -euo pipefail
          MAKEFILES_DIR="${MAKEFILES_DIR:-.makefiles}"
          if [ ! -f "${MAKEFILES_DIR}/skills/versioning.mk" ]; then
            if [ -e "${MAKEFILES_DIR}" ]; then
              echo "==> Removing incomplete ${MAKEFILES_DIR} before init"
              rm -rf "${MAKEFILES_DIR}"
            fi
            make init
          else
            echo "==> Makefile skills already present at ${MAKEFILES_DIR}"
          fi

      - name: Install Development Dependencies
        run: |
          make PYTHON=python ${{ inputs.install-target }}

      - name: Run CI Checks
        run: |
          make PYTHON=python ${{ inputs.ci-target }}
