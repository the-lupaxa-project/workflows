name: Reusable Workflow Notifier

on:
  workflow_call:
    inputs:
      include_jobs:
        description: >
          "true" includes all jobs, "false" excludes jobs, and "on-failure"
          includes jobs only when the workflow did not succeed.
        required: false
        type: string
        default: "true"

      include_commit_message:
        description: "Include the commit message in the notification."
        required: false
        type: boolean
        default: true

      notify_on_results:
        description: >
          Comma-separated list of results to notify on, for example
          "failure,cancelled,timed_out". Use "all" to notify on every result.
        required: false
        type: string
        default: "all"

      ignore_jobs:
        description: >
          Comma-separated list of job names to exclude from the per-job Slack fields.
          Names are normalised and matched case-insensitively.
        required: false
        type: string
        default: ""

      api_retries:
        description: "Number of retries for transient GitHub API failures."
        required: false
        type: string
        default: "3"

    secrets:
      slack_webhook_url:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  generate-workflow-notifier:
    name: Generate Workflow Notifications
    runs-on: ubuntu-latest

    if: >
      always() &&
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )

    steps:
      - name: Require Slack Webhook Secret
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::error::Missing required secret 'slack_webhook_url'."
            echo "::error::Pass it explicitly from the caller:"
            echo "::error::  secrets.slack_webhook_url <- repository/org SLACK_WEBHOOK_URL"
            echo "::error::(secrets: inherit does not work across organisations.)"
            {
              echo "## Configuration"
              echo "- slack_webhook_url: missing"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          {
            echo "## Configuration"
            echo "- slack_webhook_url: provided"
            echo "- notify_on_results: \`${{ inputs.notify_on_results }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout Workflows Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: the-lupaxa-project/workflows
          path: lupaxa-workflows

      - name: Send Workflow Notification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          SEND_TO_SLACK_RESULTS: ${{ inputs.notify_on_results }}
          SEND_TO_SLACK_INCLUDE_JOBS: ${{ inputs.include_jobs }}
          SEND_TO_SLACK_INCLUDE_COMMIT_MESSAGE: ${{ inputs.include_commit_message }}
          SEND_TO_SLACK_IGNORE_JOBS: "Generate Workflow Summary,Generate Workflow Notifications,${{ inputs.ignore_jobs }}"
          SEND_TO_SLACK_API_RETRIES: ${{ inputs.api_retries }}
        run: |
          python -u lupaxa-workflows/.github/scripts/workflow-notifier.py
          {
            echo "## Notification"
            echo "- Slack delivery attempted (see job logs for sent/skipped detail)"
          } >> "${GITHUB_STEP_SUMMARY}"
