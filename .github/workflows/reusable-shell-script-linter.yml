name: Reusable Shell Script Linter

on:
  workflow_call:
    inputs:
      include_files:
        description: "Comma-separated list of files or regex patterns to include"
        required: false
        type: string
        default: ""

      exclude_files:
        description: "Comma-separated list of files or regex patterns to exclude"
        required: false
        type: string
        default: ""

      report_only:
        description: "Do not fail the build even if errors occur"
        required: false
        type: string
        default: "false"

      show_errors:
        description: "Show detailed error output"
        required: false
        type: string
        default: "true"

permissions:
  contents: read

jobs:
  shell-script-linter:
    name: Shell Script Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Shell Script Linter (ShellCheck)
        env:
          INCLUDE_FILES: ${{ inputs.include_files }}
          EXCLUDE_FILES: ${{ inputs.exclude_files }}
          REPORT_ONLY: ${{ inputs.report_only }}
          SHOW_ERRORS: ${{ inputs.show_errors }}
        run: |
          bash <(curl -s https://raw.githubusercontent.com/CICDToolbox/shellcheck/master/pipeline.sh)
