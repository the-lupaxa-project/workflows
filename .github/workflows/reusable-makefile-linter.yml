name: Reusable Makefile Linter

on:
  workflow_call:
    inputs:
      include_files:
        description: "Comma-separated list of files or regex patterns to include"
        required: false
        type: string

      exclude_files:
        description: "Comma-separated list of files or regex patterns to exclude"
        required: false
        type: string

      report_only:
        description: "Generate a report but do not fail the build"
        required: false
        type: boolean
        default: false

      show_errors:
        description: "Show detailed errors"
        required: false
        type: boolean
        default: true

      show_skipped:
        description: "Show skipped files (mapped to SHOW_FILTERED for the CICD pipeline)"
        required: false
        type: boolean
        default: false

      no_color:
        description: "Disable coloured output"
        required: false
        type: boolean
        default: false

      check_conventions:
        description: "Run makefile-skills convention checks after checkmake"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  reusable-makefile-linter:
    name: Reusable Makefile Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Caller Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set Up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "stable"

      - name: Run Makefile Lint (CICD Toolbox)
        env:
          INCLUDE_FILES: ${{ inputs.include_files }}
          EXCLUDE_FILES: ${{ inputs.exclude_files }}
          REPORT_ONLY: ${{ inputs.report_only }}
          SHOW_ERRORS: ${{ inputs.show_errors }}
          SHOW_FILTERED: ${{ inputs.show_skipped }}
          NO_COLOR: ${{ inputs.no_color }}
        run: |
          bash <(curl -s https://raw.githubusercontent.com/lupaxa-cicd-toolbox/makefile-lint/master/src/pipeline.sh)

      - name: Checkout Workflows Repository
        if: ${{ inputs.check_conventions }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: the-lupaxa-project/workflows
          path: lupaxa-dotgithub

      - name: Run Makefile Convention Checks
        if: ${{ inputs.check_conventions }}
        env:
          INCLUDE_FILES: ${{ inputs.include_files }}
          EXCLUDE_FILES: ${{ inputs.exclude_files }}
          REPORT_ONLY: ${{ inputs.report_only }}
          SHOW_ERRORS: ${{ inputs.show_errors }}
          SHOW_SKIPPED: ${{ inputs.show_skipped }}
          NO_COLOR: ${{ inputs.no_color }}
          CHECK_CONVENTIONS: "true"
          SKIP_CHECKMAKE: "true"
          ROOT_DIR: ${{ github.workspace }}
          EXCLUDE_FILES_EXTRA: "lupaxa-dotgithub/"
        run: |
          bash lupaxa-dotgithub/.github/scripts/makefile-linter.sh
