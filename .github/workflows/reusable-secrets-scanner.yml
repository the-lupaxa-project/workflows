name: Reusable Secrets Scanner

on:
  workflow_call:
    inputs:
      path:
        description: "Repository path to scan (relative to the workspace)"
        required: false
        default: "."
        type: string

      base:
        description: "Base ref (maps to --since-commit); leave empty for the default PR/push behaviour"
        required: false
        default: ""
        type: string

      head:
        description: "Head ref (maps to --branch); leave empty for the default PR/push behaviour"
        required: false
        default: ""
        type: string

      extra_args:
        description: "Extra arguments passed to the TruffleHog CLI"
        required: false
        default: "--results=verified,unknown"
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets-scanner:
    name: Secrets Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          path: ${{ inputs.path }}
          base: ${{ inputs.base }}
          head: ${{ inputs.head }}
          extra_args: ${{ inputs.extra_args }}
