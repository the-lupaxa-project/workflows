name: Local Python Scripts CI

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/local-python-scripts-ci.yml"
      - ".github/workflows/reusable-python-ci.yml"
      - "tests/**/*.py"

  pull_request:
    branches:
      - "master"
    paths:
      - ".github/scripts/**"
      - ".github/workflows/local-python-scripts-ci.yml"
      - ".github/workflows/reusable-python-ci.yml"
      - "tests/**/*.py"

  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  python-ci:
    name: Python CI
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      paths: ".github/scripts,tests"

  generate-workflow-summary:
    name: Generate Workflow Summary
    needs:
      - python-ci
    if: always()
    uses: ./.github/workflows/reusable-workflow-summary.yml

  generate-workflow-notifications:
    name: Generate Workflow Notifications
    needs:
      - generate-workflow-summary
    if: always()
    uses: ./.github/workflows/reusable-workflow-notifier.yml
    with:
      notify_on_results: "failure,timed_out"
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
