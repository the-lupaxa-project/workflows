name: Reusable Rust CI via Make

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-makefile-ci:
    name: Rust CI via Make
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set Up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30  # v2.0.1
        with:
          toolchain: stable
          components: clippy

      - name: Show Rust Version
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      # .makefiles/ is gitignored; clone makefile-skills before rust-* targets exist.
      # make init errors if the directory already exists, so mirror ensure-skills.
      - name: Ensure Makefile Skills
        run: |
          set -euo pipefail
          MAKEFILES_DIR="${MAKEFILES_DIR:-.makefiles}"
          if [ ! -f "${MAKEFILES_DIR}/skills/versioning.mk" ]; then
            if [ -e "${MAKEFILES_DIR}" ]; then
              echo "==> Removing incomplete ${MAKEFILES_DIR} before init"
              rm -rf "${MAKEFILES_DIR}"
            fi
            make init
          else
            echo "==> Makefile skills already present at ${MAKEFILES_DIR}"
          fi

      - name: Run CI Checks
        run: |
          make rust-check
