name: Reusable Python Package Publisher

# DEPRECATED for PyPI / TestPyPI Trusted Publishing.
#
# GitHub OIDC sets job_workflow_ref to this reusable workflow, and PyPI Trusted
# Publishing does not support reusable workflows as the publisher workflow.
# Inline hatch build + pypa/gh-action-pypi-publish in the consumer release
# workflow instead (e.g. generate-release.yml / generate-test-release.yml).
#
# See:
#   https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
#   https://github.com/pypa/gh-action-pypi-publish/issues/166

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version used to build the package"
        required: false
        type: string
        default: "3.13"

      repository-url:
        description: >
          Package index upload URL.
          Defaults to production PyPI. Use https://test.pypi.org/legacy/ for TestPyPI.
        required: false
        type: string
        default: "https://upload.pypi.org/legacy/"

      verbose:
        description: "Enable verbose output from the PyPI publish action"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  python-package-publisher:
    name: Python Package Publisher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Build Backend
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build Distribution
        run: |
          hatch build

      # Trusted publishing (OIDC). The calling repository must be configured as a
      # Trusted Publisher on the target PyPI / TestPyPI project.
      - name: Publish Package via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: ${{ inputs.repository-url }}
          verbose: ${{ inputs.verbose }}
