name: Reusable GitHub Release Generator

on:
  workflow_call:
    inputs:
      tag:
        description: >
          Tag ref to release (for example: "refs/tags/v1.2.3").
          Defaults to github.ref if not provided.
        required: false
        type: string

      release_name:
        description: >
          Optional release name override.
          Defaults to the tag name with the "refs/*/" prefix removed.
        required: false
        type: string

      draft:
        description: "Create the release as a draft."
        required: false
        type: boolean
        default: false

      prerelease:
        description: "Mark the release as a pre-release."
        required: false
        type: boolean
        default: false

    secrets:
      github-token:
        description: >
          Optional GitHub token to use for creating the release.
          If not provided, github.token is used.
        required: false
      portal-app-id:
        description: GitHub App id that can dispatch the portal catalogue sync.
        required: false
      portal-app-private-key:
        description: GitHub App private key for the portal catalogue sync.
        required: false

permissions:
  contents: write

jobs:
  get-release-version:
    name: Get Release Version
    runs-on: ubuntu-latest

    outputs:
      release-version: ${{ steps.release-version.outputs.release-version }}
      tag-to-release: ${{ steps.release-version.outputs.tag-to-release }}

    steps:
      - name: Determine Release Version
        id: release-version
        run: |
          # Determine which ref/tag to use
          REF="${{ inputs.tag || github.ref }}"
          TAG="${REF#refs/*/}"

          if [ -z "${TAG}" ]; then
            echo "::error::Release tag is empty. Pass inputs.tag or run from a tag ref."
            {
              echo "## Configuration"
              echo "- tag: missing"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          echo "tag-to-release=${TAG}" >> "${GITHUB_OUTPUT}"

          # If release_name input is provided, use it, otherwise use TAG
          NAME="${{ inputs.release_name }}"
          if [ -z "${NAME}" ]; then
            NAME="${TAG}"
          fi

          echo "release-version=${NAME}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Configuration"
            echo "- tag: \`${TAG}\`"
            echo "- release name: \`${NAME}\`"
            echo "- draft: \`${{ inputs.draft }}\`"
            echo "- prerelease: \`${{ inputs.prerelease }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  github-release-generator:
    name: GitHub Release Generator
    runs-on: ubuntu-latest
    needs:
      - get-release-version

    steps:
      - name: Check Release Token Configuration
        env:
          CUSTOM_GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          if [ -n "${CUSTOM_GITHUB_TOKEN}" ]; then
            TOKEN_SOURCE="caller github-token secret"
          else
            TOKEN_SOURCE="github.token (default)"
          fi
          {
            echo "## Authentication"
            echo "- token: ${TOKEN_SOURCE}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        uses: Bullrich/generate-release-changelog@6b60f004b4bf12ff271603dc32dbd261965ad2f2  # v2.0.2
        env:
          REPO: ${{ github.repository }}

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          token: ${{ secrets.github-token || github.token }}
          tag_name: ${{ needs.get-release-version.outputs.tag-to-release }}
          name: ${{ needs.get-release-version.outputs.release-version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}

  notify-portal-catalogue:
    name: Notify Portal Catalogue
    runs-on: ubuntu-latest
    needs:
      - get-release-version
      - github-release-generator
    if: ${{ !cancelled() && needs.github-release-generator.result == 'success' }}
    continue-on-error: true
    steps:
      - name: Skip when App secrets are missing
        id: gate
        env:
          APP_ID: ${{ secrets.portal-app-id }}
          APP_KEY: ${{ secrets.portal-app-private-key }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "Portal App secrets not provided; skipping catalogue sync"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check catalogue membership
        if: steps.gate.outputs.skip != 'true'
        id: listed
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/the-lupaxa-project/the-lupaxa-project.org/master/data/projects.yml"
          BODY="$(curl -fsSL "${URL}")"
          KEY="$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if printf '%s' "${BODY}" | tr '[:upper:]' '[:lower:]' | grep -Fq "github.com/${KEY}"; then
            echo "listed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Repository ${REPOSITORY} is not on the portal catalogue; skipping"
            echo "listed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GitHub App token
        if: steps.gate.outputs.skip != 'true' && steps.listed.outputs.listed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.portal-app-id }}
          private-key: ${{ secrets.portal-app-private-key }}
          owner: the-lupaxa-project
          repositories: the-lupaxa-project.org

      - name: Dispatch portal sync
        if: steps.gate.outputs.skip != 'true' && steps.listed.outputs.listed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run sync-catalogue-release.yml \
            --repo the-lupaxa-project/the-lupaxa-project.org \
            -f repository="${{ github.repository }}" \
            -f tag="${{ needs.get-release-version.outputs.tag-to-release }}"
