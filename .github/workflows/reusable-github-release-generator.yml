name: Reusable GitHub Release Generator

on:
  workflow_call:
    inputs:
      tag:
        description: >
          Tag ref to release (for example: "refs/tags/v1.2.3").
          Defaults to github.ref if not provided.
        required: false
        type: string

      release_name:
        description: >
          Optional release name override.
          Defaults to the tag name with the "refs/*/" prefix removed.
        required: false
        type: string

      draft:
        description: "Create the release as a draft."
        required: false
        type: boolean
        default: false

      prerelease:
        description: "Mark the release as a pre-release."
        required: false
        type: boolean
        default: false

    secrets:
      github-token:
        description: >
          Optional GitHub token to use for creating the release.
          If not provided, github.token is used.
        required: false

permissions:
  contents: write

jobs:
  get-release-version:
    name: Get Release Version
    runs-on: ubuntu-latest

    outputs:
      release-version: ${{ steps.release-version.outputs.release-version }}
      tag-to-release: ${{ steps.release-version.outputs.tag-to-release }}

    steps:
      - name: Determine Release Version
        id: release-version
        run: |
          # Determine which ref/tag to use
          REF="${{ inputs.tag || github.ref }}"
          TAG="${REF#refs/*/}"

          if [ -z "${TAG}" ]; then
            echo "::error::Release tag is empty. Pass inputs.tag or run from a tag ref."
            {
              echo "## Configuration"
              echo "- tag: missing"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          echo "tag-to-release=${TAG}" >> "${GITHUB_OUTPUT}"

          # If release_name input is provided, use it, otherwise use TAG
          NAME="${{ inputs.release_name }}"
          if [ -z "${NAME}" ]; then
            NAME="${TAG}"
          fi

          echo "release-version=${NAME}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Configuration"
            echo "- tag: \`${TAG}\`"
            echo "- release name: \`${NAME}\`"
            echo "- draft: \`${{ inputs.draft }}\`"
            echo "- prerelease: \`${{ inputs.prerelease }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  github-release-generator:
    name: GitHub Release Generator
    runs-on: ubuntu-latest
    needs:
      - get-release-version

    steps:
      - name: Check Release Token Configuration
        env:
          CUSTOM_GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          if [ -n "${CUSTOM_GITHUB_TOKEN}" ]; then
            TOKEN_SOURCE="caller github-token secret"
          else
            TOKEN_SOURCE="github.token (default)"
          fi
          {
            echo "## Authentication"
            echo "- token: ${TOKEN_SOURCE}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Default empty body (GitHub UI has compare). Special cases (always end with .):
      # 0.1.0 → Initial Release.; 1.0.0 → Initial Production Release.;
      # (0.1.0, 1.0.0) → Incremental Release.; >1.0.0 → Incremental Production Release.;
      # *-rcN → Release Candidate N.; *-draftN → Draft Release N.;
      # *-devN → Development Release N.
      - name: Determine Release Body
        id: release-body
        env:
          TAG: ${{ needs.get-release-version.outputs.tag-to-release }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BODY=""

          # True if $1 > $2 using version sort.
          version_gt() {
            local left="$1" right="$2"
            [ "${left}" != "${right}" ] && \
              [ "$(printf '%s\n%s\n' "${left}" "${right}" | sort -V | tail -n1)" = "${left}" ]
          }

          if [[ "${VERSION}" =~ -rc([0-9]+)$ ]]; then
            BODY="Release Candidate ${BASH_REMATCH[1]}."
          elif [[ "${VERSION}" =~ -draft([0-9]+)$ ]]; then
            BODY="Draft Release ${BASH_REMATCH[1]}."
          elif [[ "${VERSION}" =~ -dev([0-9]+)$ ]]; then
            BODY="Development Release ${BASH_REMATCH[1]}."
          elif [ "${VERSION}" = "0.1.0" ]; then
            BODY="Initial Release."
          elif [ "${VERSION}" = "1.0.0" ]; then
            BODY="Initial Production Release."
          elif version_gt "${VERSION}" "1.0.0"; then
            BODY="Incremental Production Release."
          elif version_gt "${VERSION}" "0.1.0"; then
            # 0.1.0 < version < 1.0.0 (1.0.0 already handled above)
            BODY="Incremental Release."
          fi
          {
            echo "body<<EOF"
            printf '%s\n' "${BODY}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "## Release body"
            if [ -n "${BODY}" ]; then
              echo "- ${BODY}"
            else
              echo "- _(empty)_"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          token: ${{ secrets.github-token || github.token }}
          tag_name: ${{ needs.get-release-version.outputs.tag-to-release }}
          name: ${{ needs.get-release-version.outputs.release-version }}
          body: ${{ steps.release-body.outputs.body }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
